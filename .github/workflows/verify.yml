name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      SCARF_NO_ANALYTICS: "true"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      ROCKY_DATA_DIR: .rocky-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
      - run: npm install --global npm@11.6.4
      - run: npm ci
      - run: npm run check
      - run: npm run check:docs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:secrets
      - run: npm run check:licenses
      - run: npm test
      - run: npm run build
      - run: npm run test:learning
      - run: npm run test:network
      - run: npm run test:no-python
      - run: npm run setup:browser
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            test-results/
            .rocky-reports/
            .rocky-eval/report.json
