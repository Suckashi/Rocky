name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      SCARF_NO_ANALYTICS: "true"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
      ROCKY_DATA_DIR: .rocky-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm install --global npm@11.6.4
      - run: npm ci
      - run: npm run check
      - run: npm run check:docs
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:secrets
      - run: npm run check:licenses
      - run: npm run setup:browser
      - name: Install Chromium OS dependencies on hosted Linux
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets -- --package
      - run: npm run test:learning
      - run: npm run test:network
      - run: npm run test:no-python
      - run: npm run test:e2e
      - name: Verify empty installation separately from seeded scenarios
        run: npm run test:e2e -- tests/e2e/empty-install.spec.ts
        env:
          ROCKY_E2E_EMPTY: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          retention-days: 7
          include-hidden-files: true
          path: |
            test-results/
            .rocky-reports/
            .rocky-eval/report.json
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.12.0"
      - run: npm install --global npm@11.6.4
      - run: npm run check:dependencies
