name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Windows PowerShell 5.1 is what the owner's machine runs the launcher with; it needs the BOM.
      - name: Parse Start-Rocky.ps1 with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\Start-Rocky.ps1")
          if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { Write-Error 'Start-Rocky.ps1 must be UTF-8 with BOM'; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\Start-Rocky.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
          Write-Host "PowerShell $($PSVersionTable.PSVersion): Start-Rocky.ps1 parses"
