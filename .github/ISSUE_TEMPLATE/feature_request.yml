name: Feature request / 功能提案
description: Explain a user problem and a focused improvement.
title: "[Feature]: "
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing proposals
      options:
        - label: I searched existing issues and checked docs/ROADMAP.md; this adds a new use case or missing detail.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What are you trying to accomplish, and where does Rocky get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a concrete example and the smallest useful scope.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Note any new permissions, external services, or dependencies.
  - type: input
    id: related
    attributes:
      label: Related issues or specification IDs
