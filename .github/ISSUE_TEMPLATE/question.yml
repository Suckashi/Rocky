name: Question / 使用提問
description: Ask about setup, behavior, or contributing using a concrete example.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: "Read docs/README.md and SUPPORT.md first. English and Traditional Chinese are welcome. For sensitive security reports, follow SECURITY.md instead."
  - type: textarea
    id: question
    attributes:
      label: What would you like to understand?
      description: Describe your goal and the specific behavior or documentation that is unclear.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried or read?
      description: Include a documentation link or a minimal example, if helpful.
  - type: input
    id: environment
    attributes:
      label: Version and environment (if relevant)
      description: Rocky revision, OS, and execution mode. Do not include credentials or private endpoints.
